  function showToast(text) {

  function GsheetToJSON(requestUrl) {

    var tableList; 
    var tableColumnList = ['timeStamp','transactionID','Type','Mount','Status'];

    $.ajax({
            type: "get",            
            url: requestUrl,         
            async: false,
            cache: false,              
            data: "",                
            success: function(res){   

            var table = $(res).find('td')

            
            tableList = [];

            var tableItem;
            var tableData;
            var startIndex;

            table.each(function(i,item){

              if($(item).has("div").length > 0){
                tableData = $(item).find('div').html()
              }else{
                tableData = $(item).html();
              }

              if(tableData.indexOf(':') != -1){
                tableList.push(tableItem);
                tableItem = {};
                startIndex = 0;
              }

              if(tableItem){
                tableItem[tableColumnList[startIndex]] = tableData;
                startIndex = startIndex + 1;
              }

            });

            if(tableItem){
              tableList.push(tableItem);
            }

        }
      });


    return tableList;
  }

  function simpleRequest(url){
   var Http = new XMLHttpRequest()
