    var totalSeconds = 0;

    totalSeconds = 60 * 5

//    totalSeconds = 5

    setInterval(setTime, 1000);

    function setTime() {
      --totalSeconds;
      var leftSec = pad(totalSeconds % 60);
      var leftMin = pad(parseInt(totalSeconds / 60));

      $('.countLabel').html("Timeout - " + leftMin + ":" + leftSec)


      if(totalSeconds <= 0){
        //window.location.href = "/thankyou?type=100sns"
        $('.countLabel').html("Time is over.")

      }

    }

    function pad(val) {
      var valString = val + "";
      if (valString.length < 2) {
        return "0" + valString;
      } else {
        return valString;
      }
    }

   })

    function getCoinPrice(coinName){

      $.get( "https://api.coingecko.com/api/v3/simple/price?ids="+coinName+"&vs_currencies=USD", function( data ) {
        var firstItem = data[Object.keys(data)[0]];
        firstItem = firstItem[Object.keys(firstItem)[0]]
        console.log(data)
        console.log(1/firstItem) // price for 1$

        var coinForDollar = 1/firstItem

        if(nowMount && nowMount != 0){
          var dollar = nowMount / 100
          var snsForDis = (dollar * coinForDollar).toFixed(6)

          if(coinName=="bitcoin") coinName = "BTC"

          $('.mountLabel').html(nowMount+" SNS (" +" "+snsForDis+ " "+ coinName+")")
        }
        
        });
        
      }


  function showToast(text) {

    //var toast = $('.toast');

    var toast = $('<div class="toastDiv">'+text+'</div>')

    $('body').append(toast)
      
      //Set the content of the Toast
      //toast.text($('.toasttext').val());
      
      //Center the Toast horizontally in the header
      toast.css({
        left: ($(document).width() - toast.outerWidth(true))/2
      });
      
      toast.fadeIn(200).delay(1500).fadeOut(200);

  }


</script>
